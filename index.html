<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Geometry Dash - Mobile with Restart Button</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 Yatay Ekran Oranı */
      max-height: 100vh;
      max-width: 177.78vh;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(to bottom, #110826, #2a104e);
    }
    /* Üst Butonlar */
    .btn {
      position: absolute;
      top: 12px;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      z-index: 100;
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.95);
    }
    #restart-btn {
      left: 12px;
      background: rgba(255, 0, 85, 0.85);
      color: #fff;
    }
    #fullscreen-btn {
      right: 12px;
      background: rgba(0, 240, 255, 0.85);
      color: #000;
    }
  </style>
</head>
<body>

<div id="game-container">
  <button id="restart-btn" class="btn">Yeniden Doğ</button>
  <button id="fullscreen-btn" class="btn">Tam Ekran</button>
  <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');
const fsBtn = document.getElementById('fullscreen-btn');
const restartBtn = document.getElementById('restart-btn');

// Oyun Sabitleri
const GROUND_Y = 360;
const GRAVITY = 0.68;
const JUMP_FORCE = -11; // Dengeli zıplama yüksekliği
const FORWARD_SPEED = 6.5; // Karakterin sağa ilerleme hızı

let score = 0;
let cameraX = 0; // Kamera Pozisyonu

// Oyuncu Nesnesi
const player = {
  x: 100,
  y: GROUND_Y - 40,
  size: 40,
  vy: 0,
  isGrounded: false,
  rotation: 0,
  
  reset() {
    this.x = 100;
    this.y = GROUND_Y - this.size;
    this.vy = 0;
    this.isGrounded = true;
    this.rotation = 0;
  },

  jump() {
    if (this.isGrounded) {
      this.vy = JUMP_FORCE;
      this.isGrounded = false;
    }
  },

  update() {
    // Dümdüz Sağa İlerleme
    this.x += FORWARD_SPEED;

    // Yerçekimi & Dikey Hareket
    this.vy += GRAVITY;
    this.y += this.vy;

    // Zemine İniş Kontrolü
    if (this.y >= GROUND_Y - this.size) {
      this.y = GROUND_Y - this.size;
      this.vy = 0;
      this.isGrounded = true;
      // Takla tamamlandığında dereceyi en yakın 90'a yuvarlayıp oturtur
      this.rotation = Math.round(this.rotation / 90) * 90;
    } else {
      // Havadayken takla animasyonu
      this.rotation += 9;
    }
  },

  draw(camX) {
    ctx.save();
    // Kameraya göre ekrandaki X pozisyonu
    const screenX = this.x - camX;
    
    ctx.translate(screenX + this.size / 2, this.y + this.size / 2);
    ctx.rotate((this.rotation * Math.PI) / 180);

    // Kare Karakter Dış Çerçeve
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
    
    // Kenarlık
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
    
    // İç Kare Detayı
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-8, -8, 16, 16);

    ctx.restore();
  }
};

// Engeller ve Parkur
let obstacles = [];
let lastSpawnX = 600;

function generateObstacles() {
  // Karakterin ilerisindeki haritayı dinamik oluştur
  while (lastSpawnX < player.x + 900) {
    const types = ['spike', 'double_spike', 'block', 'block_spike'];
    const type = types[Math.floor(Math.random() * types.length)];
    const distance = 280 + Math.random() * 180; // Engeller arası mesafe
    const spawnX = lastSpawnX + distance;

    if (type === 'spike') {
      obstacles.push({ type: 'spike', x: spawnX, y: GROUND_Y, width: 40, height: 40 });
    } else if (type === 'double_spike') {
      obstacles.push({ type: 'spike', x: spawnX, y: GROUND_Y, width: 40, height: 40 });
      obstacles.push({ type: 'spike', x: spawnX + 40, y: GROUND_Y, width: 40, height: 40 });
    } else if (type === 'block') {
      obstacles.push({ type: 'block', x: spawnX, y: GROUND_Y - 40, width: 40, height: 40 });
    } else if (type === 'block_spike') {
      obstacles.push({ type: 'block', x: spawnX, y: GROUND_Y - 40, width: 40, height: 40 });
      obstacles.push({ type: 'spike', x: spawnX + 40, y: GROUND_Y, width: 40, height: 40 });
    }

    lastSpawnX = spawnX;
  }
}

function updateObstacles() {
  generateObstacles();

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];

    // Arkada kalan engelleri hafızadan sil
    if (obs.x + obs.width < cameraX - 100) {
      obstacles.splice(i, 1);
    }

    // Çarpışma Kontrolü
    if (checkCollision(player, obs)) {
      restartGame();
    }
  }
}

function drawObstacles(camX) {
  obstacles.forEach(obs => {
    const screenX = obs.x - camX;
    
    // Yalnızca ekranda görünen engelleri çiz
    if (screenX > -100 && screenX < canvas.width + 100) {
      if (obs.type === 'spike') {
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.moveTo(screenX, obs.y);
        ctx.lineTo(screenX + obs.width / 2, obs.y - obs.height);
        ctx.lineTo(screenX + obs.width, obs.y);
        ctx.closePath();
        ctx.fill();
        
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (obs.type === 'block') {
        ctx.fillStyle = '#ff9900';
        ctx.fillRect(screenX, obs.y, obs.width, obs.height);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeRect(screenX, obs.y, obs.width, obs.height);
      }
    }
  });
}

// AABB Çarpışma Hesabı
function checkCollision(p, o) {
  const pad = o.type === 'spike' ? 6 : 2;
  const pL = p.x + pad, pR = p.x + p.size - pad;
  const pT = p.y + pad, pB = p.y + p.size - pad;

  const oL = o.x, oR = o.x + o.width;
  const oT = o.type === 'spike' ? o.y - o.height : o.y;
  const oB = o.y;

  return pR > oL && pL < oR && pB > oT && pT < oB;
}

function restartGame() {
  obstacles = [];
  lastSpawnX = 400;
  score = 0;
  player.reset();
}

function drawEnvironment(camX) {
  // Sonsuz Zemin Çizimi
  ctx.fillStyle = '#0a0518';
  ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
  
  // Zemin Çizgisi
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(canvas.width, GROUND_Y);
  ctx.stroke();

  // Skor / Mesafe
  score = Math.max(0, Math.floor(player.x / 10) - 10);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px Arial';
  ctx.fillText(`Mesafe: ${score}m`, 160, 36);
}

// Ana Oyun Döngüsü
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Karakteri ekranın sol tarafından 150px uzaklıkta tutacak şekilde kamerayı takip ettir
  cameraX = player.x - 150;

  player.update();
  updateObstacles();

  drawEnvironment(cameraX);
  drawObstacles(cameraX);
  player.draw(cameraX);

  requestAnimationFrame(gameLoop);
}

// Dokunma ve Kontrol Olayları
function handleJump(e) {
  // Butonlara tıklandığında zıplamayı engelle
  if (e.target === fsBtn || e.target === restartBtn) return;
  
  player.jump();
  
  if (e.cancelable && e.type !== 'click') {
    e.preventDefault();
  }
}

window.addEventListener('touchstart', handleJump, { passive: false });
window.addEventListener('mousedown', handleJump);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    player.jump();
  }
});

// Yeniden Doğ Butonu Mantığı
restartBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  restartGame();
});

// Tam Ekran Butonu Mantığı
fsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!document.fullscreenElement) {
    if (container.requestFullscreen) {
      container.requestFullscreen();
    } else if (container.webkitRequestFullscreen) {
      container.webkitRequestFullscreen();
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
});

// Oyunu Başlat
restartGame();
gameLoop();
</script>

</body>
</html>
