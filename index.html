<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Dash 2D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a24;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #game-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      background: linear-gradient(to bottom, #140d2b, #2a1b4e);
      border-bottom: 4px solid #00f0ff;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Oyun Parametreleri
const GROUND_Y = 320;
const GRAVITY = 0.65;
const JUMP_FORCE = -10.5; // Dengeli yüksekliğe sahip zıplama
const GAME_SPEED = 6;

let score = 0;
let gameOver = false;

// Oyuncu (Kare) Nesnesi
const player = {
  x: 100,
  y: GROUND_Y - 40,
  size: 40,
  vy: 0,
  isGrounded: false,
  rotation: 0, // Derece cinsinden dönme açısı
  
  reset() {
    this.y = GROUND_Y - this.size;
    this.vy = 0;
    this.isGrounded = true;
    this.rotation = 0;
  },

  jump() {
    if (this.isGrounded) {
      this.vy = JUMP_FORCE;
      this.isGrounded = false;
    }
  },

  update() {
    // Fizik Güncellemesi
    this.vy += GRAVITY;
    this.y += this.vy;

    // Zemin Çarpışması
    if (this.y >= GROUND_Y - this.size) {
      this.y = GROUND_Y - this.size;
      this.vy = 0;
      this.isGrounded = true;
      // Yere indiğinde açıyı en yakın 90 dereceye yuvarlayarak düz oturt
      this.rotation = Math.round(this.rotation / 90) * 90;
    } else {
      // Havadayken takla atma animasyonu (tam bir zıplamada 360 derece döner)
      this.rotation += 8.5;
    }
  },

  draw() {
    ctx.save();
    // Dönme merkezini kulübün ortasına taşı
    ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
    ctx.rotate((this.rotation * Math.PI) / 180);

    // Kare Karakter Çizimi
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
    
    // Karakter İç Detayı (İç Kare)
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
    
    ctx.fillStyle = '#fff';
    ctx.fillRect(-10, -10, 20, 20);

    ctx.restore();
  }
};

// Engeller (Dikenler ve Duvarlar/Küpler)
let obstacles = [];

function createObstacleLayout() {
  const types = ['spike', 'block', 'double_spike', 'stack'];
  const type = types[Math.floor(Math.random() * types.length)];
  const spawnX = canvas.width + 100;

  if (type === 'spike') {
    obstacles.push({ type: 'spike', x: spawnX, y: GROUND_Y, width: 40, height: 40 });
  } else if (type === 'double_spike') {
    obstacles.push({ type: 'spike', x: spawnX, y: GROUND_Y, width: 40, height: 40 });
    obstacles.push({ type: 'spike', x: spawnX + 40, y: GROUND_Y, width: 40, height: 40 });
  } else if (type === 'block') {
    obstacles.push({ type: 'block', x: spawnX, y: GROUND_Y - 40, width: 40, height: 40 });
  } else if (type === 'stack') {
    obstacles.push({ type: 'block', x: spawnX, y: GROUND_Y - 40, width: 40, height: 40 });
    obstacles.push({ type: 'spike', x: spawnX + 40, y: GROUND_Y, width: 40, height: 40 });
  }
}

let spawnTimer = 0;

function updateObstacles() {
  spawnTimer++;
  if (spawnTimer > 80) {
    if (Math.random() < 0.6) {
      createObstacleLayout();
      spawnTimer = 0;
    }
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    obs.x -= GAME_SPEED;

    // Ekrandan çıkan engelleri sil
    if (obs.x + obs.width < 0) {
      obstacles.splice(i, 1);
      score++;
    }

    // Çarpışma Kontrolü
    if (checkCollision(player, obs)) {
      restartGame();
    }
  }
}

function drawObstacles() {
  obstacles.forEach(obs => {
    if (obs.type === 'spike') {
      // Diken Çizimi
      ctx.fillStyle = '#ff0055';
      ctx.beginPath();
      ctx.moveTo(obs.x, obs.y);
      ctx.lineTo(obs.x + obs.width / 2, obs.y - obs.height);
      ctx.lineTo(obs.x + obs.width, obs.y);
      ctx.closePath();
      ctx.fill();
      
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if (obs.type === 'block') {
      // Duvar/Küp Çizimi
      ctx.fillStyle = '#ff9900';
      ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
    }
  });
}

// AABB Çarpışma Tespiti
function checkCollision(p, o) {
  // Dikenler için biraz daha esnek hitbox
  const padding = o.type === 'spike' ? 6 : 2;
  
  const pLeft = p.x + padding;
  const pRight = p.x + p.size - padding;
  const pTop = p.y + padding;
  const pBottom = p.y + p.size - padding;

  const oLeft = o.x;
  const oRight = o.x + o.width;
  const oTop = o.type === 'spike' ? o.y - o.height : o.y;
  const oBottom = o.y;

  return pRight > oLeft && pLeft < oRight && pBottom > oTop && pTop < oBottom;
}

function restartGame() {
  obstacles = [];
  score = 0;
  spawnTimer = 0;
  player.reset();
}

function drawEnvironment() {
  // Zemin Çizimi
  ctx.fillStyle = '#0f0a1c';
  ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
  
  // Zemin Çizgisi
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(canvas.width, GROUND_Y);
  ctx.stroke();

  // Skor Göstergesi
  ctx.fillStyle = '#ffffff';
  ctx.font = '20px sans-serif';
  ctx.fillText(`Skor: ${score}`, 20, 35);
}

// Ana Oyun Döngüsü
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawEnvironment();
  
  player.update();
  player.draw();

  updateObstacles();
  drawObstacles();

  requestAnimationFrame(gameLoop);
}

// Girdi Dinleyicileri (Tıklama ve Tuş Kontrolleri)
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    player.jump();
  }
});

window.addEventListener('touchstart', (e) => {
  player.jump();
});

window.addEventListener('mousedown', () => {
  player.jump();
});

// Oyunu Başlat
player.reset();
gameLoop();
</script>

</body>
  </html>
